# Publish to PyPI on every published GitHub release, via PyPI Trusted Publishing (OIDC):
# no API token is stored anywhere.
#
# ONE-TIME SETUP on PyPI before the first release (https://pypi.org/manage/account/publishing/):
#   project      langchain-sqlite-graph-memory   (add as a "pending publisher")
#   owner        tonydzi
#   repository   langchain-sqlite-graph-memory
#   workflow     publish.yml
#   environment  pypi
# Without it the job fails with `invalid-publisher`.
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          skip-existing: true
